[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200
  [redirects.rate_limit]
    window_limit = 8
    window_size = 60
    aggregate_by = ["ip"]

[[redirects]]
  from = "/api/speech"
  to = "/.netlify/functions/speech"
  status = 200
  [redirects.rate_limit]
    window_limit = 12
    window_size = 60
    aggregate_by = ["ip"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=()"
